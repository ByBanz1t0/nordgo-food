<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando Loja... | NordGo</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         OTIMIZAÇÕES DE PERFORMANCE (FCP e LCP)
         ========================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="preload" as="image" href="../assets/images/voltar.png" fetchpriority="high">
    <!-- ========================================== -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/styles-loja.css">
</head>
<body class="loja-detalhe">
    <div id="toast-container" class="toast-container"></div>

    <header class="main-header">
        <div class="header-container">
            <div class="header-left">
                <div class="pill-badge pill-back" onclick="if (document.referrer && !document.referrer.includes('login.html')) { window.history.back(); } else { window.location.href='../index.html'; }" style="cursor: pointer;">
                    <img src="../assets/images/voltar.png" alt="Voltar" class="back-icon-img" fetchpriority="high">
                    <span class="location-text">Voltar</span>
                </div>
            </div>
            <div class="header-center">
                <div class="pill-badge pill-page-title">
                    <span id="header-nome-loja" class="header-nome-text">Carregando...</span>
                </div>
            </div>
            <div class="header-right" id="user-area">
                <div class="header-user-placeholder"></div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="loja-content">
            <section class="loja-hero">
                <div class="loja-banner" id="loja-img-fundo"></div>
                <div class="loja-perfil">
                    <div class="loja-logo-container">
                        <img id="detalhe-logo-loja" 
                             src="../assets/images/default-loja.png" 
                             alt="Logo" 
                             class="loja-logo-circular"
                             onerror="if (this.src !== window.location.origin + '/assets/images/default-loja.png') { this.src='../assets/images/default-loja.png'; }">
                    </div>
                    <h1 id="detalhe-nome-loja">Nome da Loja</h1>
                    <p id="detalhe-categoria-loja" class="tag-categoria">Categoria</p>
                    <p id="detalhe-endereco-loja" class="loja-endereco">
                        <i class="fa-solid fa-location-dot loja-endereco-icone"></i> Carregando endereço...
                    </p>
                    <div class="loja-meta">
                        <span class="meta-item"><i class="fa-solid fa-star star-icon"></i> <span id="detalhe-avaliacao">0.0</span></span>
                        <span class="divisor">•</span>
                        <span class="meta-item" id="detalhe-tempo">-- min</span>
                        <span class="divisor">•</span>
                        <span class="meta-item" id="detalhe-frete">---</span>
                    </div>
                    <p id="detalhe-descricao" class="loja-desc"></p>
                </div>
            </section>

            <section id="section-cupons-loja" class="hidden secao-cupons-container">
                <h3 class="titulo-cupons-loja">
                    <i class="fa-solid fa-ticket"></i> Cupons Disponíveis nesta Loja
                </h3>
                <div id="lista-cupons-loja" class="horizontal-scroll-container lista-cupons-carrossel"></div>
            </section>

            <section class="cardapio-section">
                <div id="container-mais-pedidos" class="hidden">
                    <h2 class="titulo-sessao">Mais Pedidos</h2>
                    <div id="lista-mais-pedidos" class="horizontal-scroll-container"></div>
                </div>
                <div id="cardapio-agrupado"></div>
            </section>

            <!-- SEÇÃO DE AVALIAÇÕES REAIS -->
            <section id="section-avaliacoes-loja" class="hidden secao-avaliacoes-container">
                <h3 class="titulo-sessao titulo-avaliacoes">
                    <i class="fa-solid fa-star titulo-avaliacoes-icone"></i> Avaliações dos Clientes
                </h3>
                <div id="lista-avaliacoes-loja" class="lista-avaliacoes-grid"></div>
            </section>
        </div>
    </main>

    <!-- MODAL DE CUSTOMIZAÇÃO -->
    <div id="modal-customizar-produto" class="modal-overlay-public">
        <div class="modal-content-public animate-pop">
            <div class="modal-public-header">
                <div class="header-info-prod-modal">
                    <h2 id="modal-cust-titulo-produto">Customizar Item</h2>
                    <p id="modal-cust-desc-produto">Detalhes do item selecionado.</p>
                </div>
                <button class="btn-fechar-modal-public" id="btn-fechar-cust">&times;</button>
            </div>
            
            <div class="modal-public-body">
                <div id="container-grupos-customizacao"></div>
            </div>

            <div class="modal-public-footer">
                <div class="footer-preco-total-bloco">
                    <span>Total do item</span>
                    <h3 id="txt-preco-dinamico-modal">R$ 0,00</h3>
                </div>
                <button id="btn-confirmar-customizacao" class="btn-adicionar-customizado">
                    <i class="fa-solid fa-cart-plus"></i> Adicionar ao Carrinho
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE DESCRIÇÃO DO PRODUTO -->
    <div id="modal-descricao-produto" class="modal-overlay-public">
        <div class="modal-content-public animate-pop">
            <div class="modal-public-header">
                <div class="header-info-prod-modal">
                    <h2 id="modal-desc-titulo-produto">Nome do Produto</h2>
                    <p id="modal-desc-nome-loja">Nome da Loja</p>
                </div>
            </div>
            <div class="modal-public-body">
                <p id="modal-desc-texto-completo" class="texto-descricao-modal"></p>
            </div>
            <div class="modal-public-footer">
                <button id="btn-fechar-modal-desc-footer" class="btn-fechar-desc-footer">Fechar</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/cart-helper.js"></script>
    <script type="module" src="../js/loja.js"></script>
</body>
</html>
