<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos | NordGo</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/styles-pedidos.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <header class="main-header">
        <div class="header-container">
            <div class="header-left">
                <div class="pill-badge pill-back" onclick="window.location.href='../index.html'">
                    <img src="../assets/images/voltar.png" alt="Voltar" class="back-icon-img">
                    <span class="location-text">Início</span>
                </div>
            </div>
            <div class="header-center">
                <div class="pill-badge pill-page-title">
                    <span class="header-nome-text"><i class="fa-solid fa-clock-rotate-left"></i> Meus Pedidos</span>
                </div>
            </div>
            <div class="header-right" id="user-area">
                <div class="header-user-placeholder"></div>
            </div>
        </div>
    </header>

    <main class="pedidos-container">
        <div id="pedidos-vazio" class="hidden">
            <div class="pedidos-vazio-block">
                <i class="fa-solid fa-receipt pedidos-vazio-icon"></i>
                <h3 class="pedidos-vazio-titulo">Nenhum pedido por aqui</h3>
                <p class="pedidos-vazio-texto">Você ainda não fez nenhum pedido no nosso aplicativo.</p>
                <a href="../index.html" class="btn-pedir-algo">Pedir Algo Gostoso</a>
            </div>
        </div>

        <div id="lista-pedidos-usuario">
            <p class="pedidos-carregando-text">Carregando histórico de pedidos...</p>
        </div>
    </main>

    <!-- Modal de Avaliação -->
    <div id="modal-avaliacao" class="modal-overlay-public">
        <div class="modal-content-public animate-pop modal-avaliacao-content">
            <div class="modal-public-header">
                <div>
                    <h2>Avaliar Pedido</h2>
                    <p id="modal-aval-subtitulo">Conte como foi sua experiência</p>
                </div>
                <button class="btn-fechar-modal-public" id="btn-fechar-modal-aval">&times;</button>
            </div>

            <div class="modal-public-body modal-avaliacao-body">
                <div class="rating-stars-wrapper">
                    <p class="rating-stars-label">Sua Nota:</p>
                    <div class="stars-selector" id="stars-selector">
                        <i class="fa-solid fa-star star-btn" data-value="1"></i>
                        <i class="fa-solid fa-star star-btn" data-value="2"></i>
                        <i class="fa-solid fa-star star-btn" data-value="3"></i>
                        <i class="fa-solid fa-star star-btn" data-value="4"></i>
                        <i class="fa-solid fa-star star-btn" data-value="5"></i>
                    </div>
                </div>

                <div class="comment-area-wrapper">
                    <label for="txt-comentario-aval" class="comment-area-label">Comentário (opcional):</label>
                    <textarea id="txt-comentario-aval" 
                              maxlength="100" 
                              rows="3" 
                              placeholder="Escreva sua opinião sobre os produtos ou a entrega (máx. 100 caracteres)..." 
                              class="comment-area-textarea"></textarea>
                    <small id="char-counter" class="char-counter-text">0 / 100</small>
                </div>
            </div>

            <div class="modal-public-footer">
                <button id="btn-enviar-avaliacao" class="btn-adicionar-customizado btn-full-width">
                    <i class="fa-solid fa-paper-plane"></i> Enviar Avaliação
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Solicitação de Reembolso -->
    <div id="modal-solicitar-reembolso" class="modal-overlay-public">
        <div class="modal-content-public animate-pop modal-reembolso-content">
            <div class="modal-public-header">
                <div>
                    <h2><i class="fa-solid fa-rotate-left modal-reembolso-icon"></i> Solicitar Reembolso</h2>
                    <p id="txt-reembolso-subtitulo">Informe o motivo da solicitação</p>
                </div>
                <button class="btn-fechar-modal-public" id="btn-fechar-modal-reembolso">&times;</button>
            </div>

            <div class="modal-public-body modal-reembolso-body">
                <div class="form-group-reembolso">
                    <label for="select-motivo-reembolso">Motivo Principal:</label>
                    <select id="select-motivo-reembolso" class="input-modal-reembolso">
                        <option value="">Carregando motivos...</option>
                    </select>
                </div>

                <div class="form-group-reembolso">
                    <label for="txt-detalhes-reembolso">Detalhes do ocorrido (opcional):</label>
                    <textarea id="txt-detalhes-reembolso" rows="3" class="input-modal-reembolso textarea-reembolso" placeholder="Descreva brevemente o que aconteceu..."></textarea>
                </div>
            </div>

            <div class="modal-public-footer modal-footer-reembolso">
                <button id="btn-cancelar-reembolso-modal" class="btn-modal-secundario">Cancelar</button>
                <button id="btn-confirmar-envio-reembolso" class="btn-modal-reembolso-danger">Enviar Solicitação</button>
            </div>
        </div>
    </div>

    <!-- Scripts Modulares -->
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/pedidos.js"></script>
</body>
</html>
