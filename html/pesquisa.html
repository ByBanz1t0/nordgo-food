<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa | NordGo</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         OTIMIZAÇÕES DE PERFORMANCE (FCP e LCP)
         ========================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- Preload do recurso visual da primeira dobra -->
    <link rel="preload" as="image" href="../assets/images/voltar.png" fetchpriority="high">
    <!-- ========================================== -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/styles-loja.css">
    <link rel="stylesheet" href="../css/styles-pesquisa.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    
    <header class="main-header">
        <div class="header-container">
            <div class="header-left">
                <div class="pill-badge pill-back" onclick="window.location.href='../index.html'" style="cursor: pointer;">
                    <img src="../assets/images/voltar.png" alt="Voltar" class="back-icon-img" fetchpriority="high">
                    <span class="location-text">Voltar</span>
                </div>
            </div>

            <div class="header-center">
                <div class="search-bar-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="input-busca" placeholder="Busque por um estabelecimento...">
                </div>
            </div>

            <div id="user-area" class="header-right">
                <div class="pill-badge" style="opacity: 0.5;">
                    <span class="user-name-text">Carregando...</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="search-info">
            <h2 id="titulo-pesquisa" class="section-title">Resultados da busca</h2>
            <p id="subtitulo-pesquisa">Buscando as melhores opções para você...</p>
        </div>

        <div id="lista-resultados"></div>
    </main>

    <!-- Modal de Customização de Produto -->
    <div id="modal-customizar-produto" class="modal-overlay-public">
        <div class="modal-content-public animate-pop">
            <div class="modal-public-header">
                <div class="header-info-prod-modal">
                    <h2 id="modal-cust-titulo-produto">Customizar Item</h2>
                    <p id="modal-cust-desc-produto">Detalhes do item selecionado.</p>
                </div>
                <button class="btn-fechar-modal-public" id="btn-fechar-cust">&times;</button>
            </div>
            
            <div class="modal-public-body">
                <div id="container-grupos-customizacao"></div>
            </div>

            <div class="modal-public-footer">
                <div class="footer-preco-total-bloco">
                    <span>Total do item</span>
                    <h3 id="txt-preco-dinamico-modal">R$ 0,00</h3>
                </div>
                <button id="btn-confirmar-customizacao" class="btn-adicionar-customizado">
                    <i class="fa-solid fa-cart-plus"></i> Adicionar ao Carrinho
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Descrição do Produto -->
    <div id="modal-descricao-produto" class="modal-overlay-public">
        <div class="modal-content-public animate-pop">
            <div class="modal-public-header">
                <div class="header-info-prod-modal">
                    <h2 id="modal-desc-titulo-produto">Nome do Produto</h2>
                    <p id="modal-desc-nome-loja">Nome da Loja</p>
                </div>
            </div>
            <div class="modal-public-body">
                <p id="modal-desc-texto-completo" class="texto-descricao-modal"></p>
            </div>
            <div class="modal-public-footer">
                <button class="btn-fechar-desc-bloco" id="btn-fechar-desc">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Scripts da aplicação -->
    <script type="module" src="../js/cart-helper.js"></script>
    <script type="module" src="../js/pesquisa.js"></script>
</body>
</html>
