<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NordGo | Sua Vitrine de Sabores</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         OTIMIZAÇÕES DE PERFORMANCE (FCP e LCP)
         ========================================== -->
    <!-- 1. Preconnect: Abre a conexão com servidores externos mais rápido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- 2. Preload: Força o download imediato da imagem que o Google considera o LCP -->
    <link rel="preload" as="image" href="assets/images/nordgo-logo.png" fetchpriority="high">

    <!-- ========================================== -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/styles-index.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    
    <header class="main-header">
        <div class="header-container">
            <div class="header-left">
                <div class="pill-badge pill-home" onclick="window.location.href='index.html'">
                    <!-- 3. fetchpriority na tag img principal -->
                    <img src="assets/images/nordgo-logo.png" alt="NordGo" class="main-logo" fetchpriority="high">
                    <span class="location-text">Home</span>
                </div>
            </div>

            <div class="header-center">
                <div class="search-bar-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="input-busca" placeholder="Busque por um estabelecimento...">
                </div>
            </div>

            <div class="header-right" id="user-area">
                <div class="pill-badge" style="opacity: 0.5;">
                    <span class="user-name-text">Carregando...</span>
                </div>
            </div>
        </div>
    </header>

    <section class="hero">
        <h2>Os melhores estabelecimentos em um só lugar</h2>
        <p>Escolha, peça e aproveite.</p>
        
        <div class="search-cep-container">
            <div class="search-cep-wrapper">
                <i class="fa-solid fa-location-dot icon-cep"></i>
                <input type="text" id="input-cep-cliente" placeholder="Busque lojas usando seu CEP...">
                <button type="button" id="btn-buscar-cep">Ver Lojas</button>
            </div>
        </div>
    </section>

    <main class="container">
        <div id="categorias-container" class="categorias-slider"></div>
        <h2 class="section-title">Explorar Lojas</h2>
        <!-- Imagens injetadas aqui pelo JS devem ter loading="lazy" nativamente no código JS -->
        <div id="lista-lojas" class="grid-lojas"></div>
    </main>

    <script type="module" src="./js/cart-helper.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
